name: Build Glide EXE

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glide-latest-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Glide
        shell: powershell
        run: |
          .\scripts\build.ps1
          if (-not (Test-Path .\dist\Glide.exe)) { throw 'Glide.exe was not created.' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glide-Windows
          path: dist/Glide.exe

      - name: Publish latest release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest .\dist\Glide.exe --target $env:GITHUB_SHA --title "Glide - Latest Build" --notes "Latest Windows build of Glide. Download Glide.exe and run it on Windows 11."
